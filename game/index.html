<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Quiz de Conhecimentos Gerais</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #1e293b;
    color: #f1f5f9;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
  }
  #quiz-container {
    background: #334155;
    padding: 32px;
    border-radius: 12px;
    width: 420px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  h1 { font-size: 20px; text-align: center; margin-top: 0; }
  #contador { text-align: center; color: #94a3b8; margin-bottom: 16px; }
  #pergunta { font-size: 18px; margin-bottom: 20px; min-height: 50px; }
  .resposta-btn {
    display: block;
    width: 100%;
    padding: 12px;
    margin-bottom: 10px;
    background: #475569;
    color: #f1f5f9;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    cursor: pointer;
    text-align: left;
  }
  .resposta-btn:hover:not(:disabled) { background: #64748b; }
  .resposta-btn.correta { background: #16a34a; }
  .resposta-btn.errada { background: #dc2626; }
  .resposta-btn:disabled { cursor: default; opacity: 0.9; }
  #feedback { min-height: 24px; margin: 12px 0; font-weight: bold; }
  #feedback.acerto { color: #4ade80; }
  #feedback.erro { color: #f87171; }
  #proxima-btn, #reiniciar-btn {
    width: 100%;
    padding: 12px;
    background: #2563eb;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    cursor: pointer;
    display: none;
  }
  #tela-resultado { display: none; text-align: center; }
  #tela-resultado h2 { font-size: 22px; }
  #pontuacao-final { font-size: 40px; font-weight: bold; margin: 10px 0; }
  #mensagem-final { color: #94a3b8; margin-bottom: 20px; }
</style>
</head>
<body>

<div id="quiz-container">
  <div id="tela-quiz">
    <h1>🧠 Quiz de Conhecimentos Gerais</h1>
    <div id="contador"></div>
    <div id="pergunta"></div>
    <div id="opcoes"></div>
    <div id="feedback"></div>
    <button id="proxima-btn">Próxima pergunta →</button>
  </div>

  <div id="tela-resultado">
    <h2>Quiz finalizado!</h2>
    <div id="pontuacao-final"></div>
    <div id="mensagem-final"></div>
    <button id="reiniciar-btn">Jogar novamente</button>
  </div>
</div>

<script>
  const perguntas = [
    {
      pergunta: "Qual é a capital do Brasil?",
      opcoes: ["Rio de Janeiro", "Brasília", "São Paulo", "Salvador"],
      correta: 1
    },
    {
      pergunta: "Quantos continentes existem?",
      opcoes: ["5", "6", "7", "8"],
      correta: 1
    },
    {
      pergunta: "Qual é o maior planeta do Sistema Solar?",
      opcoes: ["Terra", "Marte", "Júpiter", "Saturno"],
      correta: 2
    },
    {
      pergunta: "Em que ano começou a Segunda Guerra Mundial?",
      opcoes: ["1935", "1939", "1941", "1945"],
      correta: 1
    },
    {
      pergunta: "Qual é o resultado de 9 x 8?",
      opcoes: ["62", "68", "72", "81"],
      correta: 2
    }
  ];

  let indiceAtual = 0;
  let pontuacao = 0;

  const elPergunta = document.getElementById('pergunta');
  const elOpcoes = document.getElementById('opcoes');
  const elContador = document.getElementById('contador');
  const elFeedback = document.getElementById('feedback');
  const elProximaBtn = document.getElementById('proxima-btn');
  const elTelaQuiz = document.getElementById('tela-quiz');
  const elTelaResultado = document.getElementById('tela-resultado');
  const elPontuacaoFinal = document.getElementById('pontuacao-final');
  const elMensagemFinal = document.getElementById('mensagem-final');
  const elReiniciarBtn = document.getElementById('reiniciar-btn');
function carregarPergunta() {
  const atual = perguntas[indiceAtual];
  elContador.textContent = `Pergunta ${indiceAtual + 1} de ${perguntas.length}`;
    elPergunta.textContent = atual.pergunta;
    elFeedback.textContent = '';
    elFeedback.className = '';
    elProximaBtn.style.display = 'none';
    elOpcoes.innerHTML = '';

    atual.opcoes.forEach((opcao, i) => {
      const btn = document.createElement('button');
      btn.className = 'resposta-btn';
      btn.textContent = opcao;
      btn.setAttribute('data-index', i);
      btn.addEventListener('click', () => responder(i));
      elOpcoes.appendChild(btn);
    });
  }

  function responder(indiceEscolhido) {
    const atual = perguntas[indiceAtual];
    const botoes = document.querySelectorAll('.resposta-btn');

    botoes.forEach(b => b.disabled = true);

    if (indiceEscolhido === atual.correta) {
      pontuacao++;
      elFeedback.textContent = 'Correto!';
      elFeedback.className = 'acerto';
      botoes[indiceEscolhido].classList.add('correta');
    } else {
      elFeedback.textContent = `Errado! A resposta certa era: ${atual.opcoes[atual.correta]}`;
      elFeedback.className = `erro`;
      botoes[indiceEscolhido].classList.add('errada');
      botoes[atual.correta].classList.add('correta');
    }

    elProximaBtn.style.display = 'block';
  }

  elProximaBtn.addEventListener('click', () => {
    indiceAtual++;
    if (indiceAtual < perguntas.length) {
      carregarPergunta();
    } else {
      mostrarResultado();
    }
  });

  function mostrarResultado() {
    elTelaQuiz.style.display = 'none';
    elTelaResultado.style.display = 'block';
    elPontuacaoFinal.textContent = '${pontuacao} / ${perguntas.length}';
elPontuacaoFinal.textContent = `${pontuacao} / ${perguntas.length}`;
    let mensagem;
    if (pontuacao === perguntas.length) {
      mensagem = 'Excelente! Você acertou tudo!';
    } else if (pontuacao >= perguntas.length / 2) {
      mensagem = 'Muito bom! Continue assim.';
    } else {
      mensagem = 'Continue estudando e tente novamente!';
    }
    elMensagemFinal.textContent = mensagem;
    elReiniciarBtn.style.display = 'block';
  }

  elReiniciarBtn.addEventListener('click', () => {
    indiceAtual = 0;
    pontuacao = 0;
    elTelaResultado.style.display = 'none';
    elTelaQuiz.style.display = 'block';
    carregarPergunta();
  });

  carregarPergunta();
</script>

</body>
</html>
